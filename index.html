<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>CardHtetKyaSoh</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #unity-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        #unity-canvas {
            display: block;
            width: min(100vw, 56.25vh) !important;
            height: min(177.7778vw, 100vh) !important;
            aspect-ratio: 9 / 16;
            background: #000;
            border: 0;
        }

        /* Keep the correct ratio when the canvas enters fullscreen. */
        #unity-canvas:fullscreen {
            position: fixed !important;
            inset: 0 !important;
            margin: auto !important;

            width: min(100vw, 56.25vh) !important;
            height: min(177.7778vw, 100vh) !important;

            background: #000;
        }

        /* Safari / iPad fullscreen compatibility. */
        #unity-canvas:-webkit-full-screen {
            position: fixed !important;
            inset: 0 !important;
            margin: auto !important;

            width: min(100vw, 56.25vh) !important;
            height: min(177.7778vw, 100vh) !important;

            background: #000;
        }

        /* Hide the standard footer and fullscreen button. */
        #unity-footer {
            display: none !important;
        }

        #unity-loading-bar {
            position: absolute;
            z-index: 2;
        }

        #unity-warning {
            position: absolute;
            z-index: 3;
            top: 0;
            width: 100%;
        }
    </style>
</head>

<body>
    <div id="unity-container">
        <canvas id="unity-canvas"
                width="540"
                height="960"
                tabindex="-1"></canvas>

        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>

        <div id="unity-warning"></div>
    </div>

    <script>
        const canvas = document.querySelector("#unity-canvas");

        function unityShowBanner(msg, type) {
            const warningBanner =
                document.querySelector("#unity-warning");

            const div = document.createElement("div");
            div.textContent = msg;

            if (type === "error") {
                div.style.cssText =
                    "background:red;color:white;padding:10px;";
            } else {
                div.style.cssText =
                    "background:yellow;color:black;padding:10px;";

                setTimeout(() => {
                    if (div.parentNode) {
                        div.parentNode.removeChild(div);
                    }
                }, 5000);
            }

            warningBanner.appendChild(div);
        }

        const buildUrl = "Build";

        const config = {
            arguments: [],
            dataUrl: buildUrl + "/BuildTest.data",
            frameworkUrl: buildUrl + "/BuildTest.framework.js",
            codeUrl: buildUrl + "/BuildTest.wasm",
            streamingAssetsUrl: "StreamingAssets",

            companyName: "101interactive",
            productName: "CardHtetKyaSoh",
            productVersion: "0.1.0",

            showBanner: unityShowBanner
        };

        document.querySelector("#unity-loading-bar").style.display =
            "block";

        const script = document.createElement("script");
        script.src = buildUrl + "/BuildTest.loader.js";

        script.onload = () => {
            createUnityInstance(
                canvas,
                config,
                (progress) => {
                    const progressBar =
                        document.querySelector(
                            "#unity-progress-bar-full"
                        );

                    if (progressBar) {
                        progressBar.style.width =
                            (100 * progress) + "%";
                    }
                }
            ).then((unityInstance) => {
                document.querySelector(
                    "#unity-loading-bar"
                ).style.display = "none";

                // Unity's fullscreen button, if called elsewhere,
                // continues to use Unity's normal fullscreen API.
                window.unityInstance = unityInstance;

            }).catch((message) => {
                alert(message);
            });
        };

        script.onerror = () => {
            alert(
                "Failed to load the Unity game. " +
                "Please check that the Build folder exists."
            );
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
