<html lang="en">
<head>

        name="viewport"

    <title>Unity Web Player | CardHtetKyaSoh</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #unity-container {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;
            overflow: hidden;
        }

        /*
         * Maintain a 9:16 portrait canvas.
         * Fit inside the available viewport without stretching.
         */
        #unity-canvas {
            display: block;

            width: min(100vw, 56.25vh) !important;
            height: min(177.7778vw, 100vh) !important;

            flex: 0 0 auto;
            aspect-ratio: 9 / 16;

            background: #000;
            border: 0;
        }

        /*
         * Desktop fullscreen fills the screen with the container,
         * while the canvas stays portrait-shaped.
         */
        #unity-container:fullscreen {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;
        }

        /* Safari fullscreen compatibility. */
        #unity-container:-webkit-full-screen {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;
        }

        /*
         * Hide Unity's original footer.
         * The custom fullscreen button is used instead.
         */
        #unity-footer {
            display: none !important;
        }

        #unity-loading-bar {
            position: absolute;
            z-index: 2;
        }

        #unity-warning {
            position: absolute;

        #mobile-fullscreen-button {

            top: 12px;

            z-index: 1000;

            border: 1px solid #888;
            border-radius: 8px;

            font-size: 14px;
            cursor: pointer;
            touch-action: manipulation;
        }

        #mobile-fullscreen-button:active {
            background: #444;
        }

        /*
         * On mobile, use a fitted screen layout if native fullscreen
         * is unavailable. This does not force native fullscreen.
         */
        body.mobile-game-mode #unity-container {

<body>
    <div id="unity-container">

        <canvas
            id="unity-canvas"
            width="540"
            height="960"
            tabindex="-1"
        ></canvas>

        <div id="unity-loading-bar">
            <div id="unity-logo"></div>

            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>

        <div id="unity-warning"></div>

    </div>

    <button id="mobile-fullscreen-button" type="button">
        ⛶ Fullscreen
    </button>

    <script>
        const canvas = document.querySelector("#unity-canvas");

        const container = document.querySelector("#unity-container");

        const fullscreenButton = document.querySelector(
            "#mobile-fullscreen-button"
        );

        const isMobile =
            /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" &&
                navigator.maxTouchPoints > 1);

        /*
         * Display Unity warning and error messages.
         */
        function unityShowBanner(msg, type) {
            const warningBanner = document.querySelector(
                "#unity-warning"
            );

            const div = document.createElement("div");

            div.textContent = msg;

            if (type === "error") {
                div.style.cssText =
                    "background:red;color:white;padding:10px;";
            } else {
                div.style.cssText =
                    "background:yellow;color:black;padding:10px;";

                setTimeout(() => {
                    if (div.parentNode) {
                        div.parentNode.removeChild(div);
                    }
                }, 5000);
            }

            warningBanner.appendChild(div);
        }

        /*
         * Unity WebGL build configuration.
         */
        const buildUrl = "Build";

        const config = {
            arguments: [],

            dataUrl: buildUrl + "/BuildTest.data",
            frameworkUrl: buildUrl + "/BuildTest.framework.js",
            codeUrl: buildUrl + "/BuildTest.wasm",

            streamingAssetsUrl: "StreamingAssets",

            companyName: "101interactive",
            productName: "CardHtetKyaSoh",
            productVersion: "0.1.0",

            showBanner: unityShowBanner
        };

        document.querySelector(
            "#unity-loading-bar"
        ).style.display = "block";

        /*
         * Load the Unity WebGL loader.
         */
        const script = document.createElement("script");

        script.src = buildUrl + "/BuildTest.loader.js";

        script.onload = () => {
            createUnityInstance(
                canvas,
                config,
                (progress) => {
                    const progressBar = document.querySelector(
                        "#unity-progress-bar-full"
                    );

                    if (progressBar) {
                        progressBar.style.width =
                            (100 * progress) + "%";
                    }
                }
            )
            .then((unityInstance) => {
                window.unityInstance = unityInstance;

                document.querySelector(
                    "#unity-loading-bar"
                ).style.display = "none";

                /*
                 * Fullscreen button:
                 * Desktop: fullscreen the container.
                 * Mobile: attempt native fullscreen if supported.
                 */
                fullscreenButton.addEventListener(
                    "click",
                    async () => {
                        try {
                            if (document.fullscreenElement) {
                                await document.exitFullscreen();

                                fullscreenButton.style.display = "block";
                                return;
                            }

                            if (
                                document.webkitFullscreenElement
                            ) {
                                if (
                                    document.webkitExitFullscreen
                                ) {
                                    document.webkitExitFullscreen();
                                }

                                fullscreenButton.style.display = "block";
                                return;
                            }

                            /*
                             * Prefer native browser fullscreen when
                             * the browser supports it.
                             */
                            if (container.requestFullscreen) {
                                await container.requestFullscreen();

                                return;
                            }

                            /*
                             * Safari's prefixed fullscreen API.
                             */
                            if (container.webkitRequestFullscreen) {
                                container.webkitRequestFullscreen();

                                return;
                            }

                            /*
                             * Mobile fallback:
                             * Keep the game fitted to the viewport.
                             * This is NOT native browser fullscreen.
                             */
                            if (isMobile) {
                                document.body.classList.toggle(
                                    "mobile-game-mode"
                                );

                                return;
                            }

                            /*
                             * Last fallback for browsers that don't
                             * support container fullscreen.
                             */
                            unityInstance.SetFullscreen(1);

                        } catch (error) {
                            console.warn(
                                "Fullscreen request failed:",
                                error
                            );

                            /*
                             * If native fullscreen fails on mobile,
                             * retain the fitted portrait layout.
                             */
                            if (isMobile) {
                                document.body.classList.add(
                                    "mobile-game-mode"
                                );
                            } else {
                                try {
                                    unityInstance.SetFullscreen(1);
                                } catch (fallbackError) {
                                    console.error(
                                        "Fullscreen unavailable:",
                                        fallbackError
                                    );
                                }
                            }
                        }
                    }
                );

                /*
                 * Restore the button when fullscreen is exited.
                 */
                function updateFullscreenButton() {
                    const isFullscreen =
                        !!document.fullscreenElement ||
                        !!document.webkitFullscreenElement;

                    fullscreenButton.style.display =
                        isFullscreen ? "none" : "block";
                }

                document.addEventListener(
                    "fullscreenchange",
                    updateFullscreenButton
                );

                document.addEventListener(
                    "webkitfullscreenchange",
                    updateFullscreenButton
                );
            })
            .catch((message) => {
                console.error(message);

                alert(
                    "Unable to load the Unity game: " + message
                );
            });
        };

        script.onerror = () => {
            alert(
                "Failed to load the Unity game. " +
                "Check that the Build folder contains " +
                "BuildTest.loader.js."
            );
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
